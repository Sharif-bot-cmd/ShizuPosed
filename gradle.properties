# ─────────────────────────────────────────────────────────────────────────
# Gradle daemon / JVM
# ─────────────────────────────────────────────────────────────────────────
#
# -Xmx2048m is tight for an Android release build. R8 and the Java
# compiler routinely want 2-4 GB of heap on a project with modules,
# libraries, and native code. On Termux running on a phone, the safe
# ceiling is roughly half of physical RAM. If the device has 8 GB,
# 4g is fine. On 6 GB, use 3g. On 4 GB, keep 2g and expect occasional
# OOM kills of the daemon.
#
# MaxMetaspaceSize raised to 1g: Android builds load a lot of classes
# into metaspace (AGP, R8, D8, and every library on the compile
# classpath). 512m can trigger "Metaspace" OOMs late in the build
# even when the heap is fine.
#
# HeapDumpOnOutOfMemoryError writes a .hprof next to the build when the
# daemon dies, which is the only way to actually diagnose an OOM.
#
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Configuration cache: skip the entire configuration phase on repeat
# builds. If any build script in the project is not
# configuration-cache-safe, the build will fail with a clear error
# naming the offending script. Comment this line out to fall back to
# the old behavior.
org.gradle.configuration-cache=true

# configuration-on-demand: only configure projects actually needed by
# the requested tasks. No-op for single-module, real win for
# multi-module.
org.gradle.configureondemand=true

# Warnings are noisy and slow to print. Keep them off for iteration;
# turn them back on for the final shipping build if you care.
org.gradle.warning.mode=none

# ─────────────────────────────────────────────────────────────────────────
# Android
# ─────────────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.useFullClasspathForDexingTransform=true
android.nonTransitiveRClass=true

# R8 full mode: smaller and faster runtime output, at the cost of
# slightly slower build. Worth it for a release APK.
android.enableR8.fullMode=true

# Resource optimizations: strips unused resources more aggressively
# during release. Small build cost, smaller APK.
android.enableResourceOptimizations=true

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.suppressUnsupportedCompileSdk=37

# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
# ─────────────────────────────────────────────────────────────────────────
# Toolchain discovery
# ─────────────────────────────────────────────────────────────────────────
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true
