plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shizuposed.manager'
    compileSdk 35

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 29
        targetSdk 35
        versionCode 15
        versionName "1.8"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    // ============================================================
    // SHIZUKU - Using Shared API JAR
    // ============================================================
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')  // ← ADD THIS!
    
    // OR use fileTree to include all JARs
    // implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // ============================================================
    // ANDROIDX CORE
    // ============================================================
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    // ============================================================
    // OTHER DEPENDENCIES
    // ============================================================
    implementation 'com.google.code.gson:gson:2.11.0'
    
    // ============================================================
    // TESTING
    // ============================================================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}
