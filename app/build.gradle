// ═══════════════════════════════════════════════════════════════════════════
// XPOSEDHOOK.DEX PIPELINE
//
// All values the task needs are captured at configuration time so
// the doLast closure never touches `project`, `android`, or
// `configurations`. That's what keeps the configuration cache
// happy.
// ═══════════════════════════════════════════════════════════════════════════

// ─── SDK discovery (configuration time) ───────────────────────────────────

def makeDexSdkDir = System.getenv('ANDROID_HOME')
    ?: System.getenv('ANDROID_SDK_ROOT')
    ?: project.findProperty('android.sdk.dir')

if (makeDexSdkDir == null) {
    throw new GradleException(
        "ANDROID_HOME / ANDROID_SDK_ROOT / android.sdk.dir not set — cannot locate d8.")
}

def makeDexBuildToolsRoot = new File(makeDexSdkDir.toString(), 'build-tools')
if (!makeDexBuildToolsRoot.exists()) {
    throw new GradleException("No build-tools under $makeDexBuildToolsRoot")
}

def makeDexD8 = makeDexBuildToolsRoot.listFiles()
    .findAll { it.isDirectory() }
    .sort { a, b -> b.name <=> a.name }
    .collect { new File(it, 'd8') }
    .find { it.exists() }

if (makeDexD8 == null) {
    throw new GradleException(
        "d8 not found under $makeDexBuildToolsRoot. Install build-tools via sdkmanager.")
}

// ─── Platform jar discovery (configuration time) ──────────────────────────

def makeDexCompileSdkVersion = android.compileSdk
def makeDexCompileSdkMinor = 0
try {
    makeDexCompileSdkMinor = android.compileSdkMinor
} catch (Throwable ignored) {}

def makeDexPlatformsRoot = new File(makeDexSdkDir.toString(), 'platforms')
def makeDexCandidatePlatformDirs = [
    makeDexCompileSdkMinor > 0
        ? "android-${makeDexCompileSdkVersion}.${makeDexCompileSdkMinor}" : null,
    "android-${makeDexCompileSdkVersion}",
    "android-37.0.1",
    "android-37.0",
    "android-36",
    "android-35",
].findAll { it != null }

def makeDexPlatformJar = null
def makeDexPlatformDirUsed = null
for (String name : makeDexCandidatePlatformDirs) {
    File candidate = new File(makeDexPlatformsRoot, "${name}/android.jar")
    if (candidate.exists()) {
        makeDexPlatformJar = candidate
        makeDexPlatformDirUsed = new File(makeDexPlatformsRoot, name)
        break
    }
}

if (makeDexPlatformJar == null) {
    throw new GradleException(
        "Could not locate android.jar under ${makeDexPlatformsRoot.absolutePath}. " +
        "Tried: ${makeDexCandidatePlatformDirs.join(', ')}. " +
        "Install the platform with sdkmanager, e.g. " +
        "`sdkmanager \"platforms;android-${makeDexCompileSdkVersion}\"`.")
}

// ─── Debug compile classpath (after AGP creates the configuration) ────────

def makeDexLibJars = []
def makeDexAarFiles = []

afterEvaluate {
    def cp = configurations.findByName('debugCompileClasspath')
    if (cp != null) {
        try {
            cp.resolve().each { f ->
                if (f.name.endsWith('.jar')) {
                    makeDexLibJars << f.absolutePath
                } else if (f.name.endsWith('.aar')) {
                    makeDexAarFiles << f
                }
            }
        } catch (Throwable t) {
            println "makeDex: warning — could not resolve debugCompileClasspath: ${t.message}"
        }
    } else {
        println "makeDex: warning — debugCompileClasspath not found"
    }
}

def makeDexMinSdk = android.defaultConfig.minSdk

// ─── The task itself ──────────────────────────────────────────────────────

tasks.register('makeDex') {
    description = 'Build XposedHook.dex from compiled classes + Pine'
    group = 'build'

    dependsOn 'compileDebugJavaWithJavac'

    def classesDirProvider = layout.buildDirectory.dir('intermediates/javac/debug/classes')
    def alternateClassesDirProvider = layout.buildDirectory.dir(
        'intermediates/javac/debug/compileDebugJavaWithJavac/classes')
    def outDirProvider     = layout.buildDirectory.dir('outputs/dex')
    def outDexProvider     = outDirProvider.map { dir -> new File(dir.asFile, 'XposedHook.dex') }
    def pineJar            = file("${projectDir}/libs/pine-0.3.0.jar")
    def projectDirCapture  = projectDir

    outputs.dir(outDirProvider)
    outputs.file(outDexProvider)

    doLast {
        def outDir = outDirProvider.get().asFile
        def outDex = new File(outDir, 'XposedHook.dex')

        // Locate the javac output directory. AGP 9.x moved it from
        // build/intermediates/javac/debug/classes to a task-named
        // subdirectory. Try the known paths in order.
        def candidates = [
            classesDirProvider.get().asFile,
            alternateClassesDirProvider.get().asFile,
        ]
        def classesDir = candidates.find { it.exists() }
        if (classesDir == null) {
            println "makeDex: classes dir not found at any known location"
            candidates.each {
                println "makeDex:   ${it.absolutePath} (exists=${it.exists()})"
            }
            // Fall back to the primary candidate so downstream code
            // has something to iterate.
            classesDir = candidates[0]
        } else {
            println "makeDex: using classes dir ${classesDir.absolutePath}"
        }
        outDir.mkdirs()

        def wanted = []
        classesDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def p = f.absolutePath
            if (p.contains('/core/')
                    || p.contains('/de/robv/android/xposed/')
                    || p.contains('/stealth/')) {
                wanted << p
            }
        }

        // Extract Pine classes.
        if (pineJar.exists()) {
            def pineExtract = new File(outDir, 'pine-classes')
            pineExtract.mkdirs()
            extractZipEntries(pineJar, pineExtract) { name ->
                name.endsWith('.class')
            }
            pineExtract.eachFileRecurse { f ->
                if (f.name.endsWith('.class')) wanted << f.absolutePath
            }
            println "makeDex: Pine classes extracted from ${pineJar.name}"
        } else {
            println "makeDex: WARNING — Pine jar not found at ${pineJar.absolutePath}"
        }

        if (wanted.isEmpty()) {
            throw new GradleException(
                "No .class files matched. Check that the app compiles and " +
                "that libs/pine-0.3.0.jar exists.")
        }
        println "makeDex: ${wanted.size()} .class files matched"

        // Extract classes.jar from each AAR into the output dir.
        def libJars = new ArrayList<String>(makeDexLibJars)
        for (File aar : makeDexAarFiles) {
            def cacheDir = new File(outDir, "aar-libs/${aar.name}")
            cacheDir.mkdirs()
            def classesJar = new File(cacheDir, 'classes.jar')
            if (!classesJar.exists()) {
                extractZipEntries(aar, cacheDir) { name ->
                    name == 'classes.jar'
                }
            }
            if (classesJar.exists()) libJars << classesJar.absolutePath
        }

        libJars << makeDexPlatformJar.absolutePath
        println "makeDex: using platform jar ${makeDexPlatformJar.absolutePath}"
        println "makeDex: platform dir ${makeDexPlatformDirUsed.absolutePath}"

        // Build and run the d8 command.
        def cmd = [makeDexD8.absolutePath, '--release',
                   '--min-api', "${makeDexMinSdk}",
                   '--output', outDir.absolutePath]
        cmd.addAll(wanted)
        libJars.each { j -> cmd.addAll(['--lib', j]) }

        println "makeDex: running d8 -> $outDex"
        def proc = cmd.execute()
        def stdout = new StringBuilder()
        def stderr = new StringBuilder()
        proc.waitForProcessOutput(stdout, stderr)
        if (stdout.length() > 0) print stdout.toString()
        if (stderr.length() > 0) System.err.print(stderr.toString())

        if (proc.exitValue() != 0) {
            throw new GradleException("d8 failed with exit code ${proc.exitValue()}")
        }

        def produced = new File(outDir, 'classes.dex')
        if (produced.exists()) {
            if (outDex.exists()) outDex.delete()
            if (!produced.renameTo(outDex)) {
                outDex.bytes = produced.bytes
                produced.delete()
            }
        }

        if (!outDex.exists() || outDex.length() == 0) {
            throw new GradleException("d8 produced no usable dex at $outDex")
        }
        println "makeDex: done — ${outDex.length()} bytes at $outDex"
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// TASK WIRING
// ═══════════════════════════════════════════════════════════════════════════

tasks.matching { it.name == 'mergeDebugAssets' ||
                 it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name == 'assembleDebug' ||
                 it.name == 'assembleRelease' }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('generate') &&
                 it.name.contains('LintVital') &&
                 it.name.endsWith('ReportModel') }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('generate') &&
                 it.name.endsWith('LintReportModel') }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('lint') }.configureEach {
    mustRunAfter 'makeDex'
}