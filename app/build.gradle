plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.shizuposed.manager'

    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 28
        targetSdk 37
        versionCode 5680
        versionName "1.4.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        // ── Manifest placeholders ─────────────────────────────────
        // With the flavors removed, these live here. The cloak
        // flow at runtime rewrites them when it rebuilds the APK
        // under a new package name.
        manifestPlaceholders = [
            statusAuthority:       "com.shizuposed.manager.status",
            shizukuAuthority:      "com.shizuposed.manager.shizuku",
            watcherAuthority:      "com.shizuposed.manager.shizuku-watcher",
            fileProviderAuthority: "com.shizuposed.manager.fileprovider",
        ]

        // ── Cloak-flow build config ───────────────────────────────
        // ORIGINAL_PACKAGE_NAME is the package this APK was built
        // with. ManagerCloakFlow uses it as the "old package" to
        // uninstall after a cloak install succeeds, and as the
        // target package name when reverting a cloaked install.
        buildConfigField "String", "ORIGINAL_PACKAGE_NAME",
            "\"${applicationId}\""

        // DOWNLOAD_URL_STANDARD is the URL ManagerCloakFlow.revertToOriginal()
        // downloads from to restore the original package.
        buildConfigField "String", "DOWNLOAD_URL_STANDARD",
            "\"https://github.com/Sharif-bot-cmd/ShizuPosed/releases/latest/download/app-standard-release.apk\""
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties missing — release APK will be unsigned")
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
        resValues true
    }

    androidResources {
        // Required for the cloak flow: the signer needs .so entries
        // stored (uncompressed). If they're deflated, apkzlib fails
        // to sign, and the rebuilt APK won't install.
        noCompress += [".so"]

        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                '**/libshizuposed.so',
                '**/libamiru.so',
                '**/libcallsite.so',
                '**/libxstealth.so',
                '**/libxstealth_next.so',
                '**/libxstealth_bridge.so',
                '**/libsysku.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += layout.buildDirectory.dir('outputs/dex')
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')
    implementation files('libs/pine-0.3.0.jar')

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'

    implementation 'androidx.activity:activity:1.9.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.code.gson:gson:2.11.0'

    // ── Hide ShizuPosed app (cloak flow) ─────────────────────────
    // ManifestEditor rewrites AndroidManifest.xml in the rebuilt APK.
    implementation 'com.github.WindySha:ManifestEditor:master-SNAPSHOT'
    // apkzlib re-signs the rebuilt APK. Vendored from LSPatch to
    // avoid the published version's AGP compatibility issues.
    implementation project(':apkzlib')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}

// ═══════════════════════════════════════════════════════════════════════════
// NATIVE LIBRARY PRESENCE CHECKS
// ═══════════════════════════════════════════════════════════════════════════

def skipNativeCheck = project.hasProperty('skipNativeCheck')
        && project.property('skipNativeCheck') == 'true'

def jniLibsDir = file('src/main/jniLibs/arm64-v8a')

tasks.register('checkNativeShim') {
    description = 'Verify libshizuposed.so is present for arm64-v8a (required)'
    group = 'verification'

    def so = new File(jniLibsDir, 'libshizuposed.so')

    doLast {
        if (skipNativeCheck) {
            println "checkNativeShim: skipped via -PskipNativeCheck=true"
            return
        }
        if (!so.exists()) {
            throw new GradleException(
                "libshizuposed.so not found at ${so.absolutePath}\n" +
                "Build it with:\n" +
                "  clang -shared -fPIC -O2 -Wall -Wextra \\\n" +
                "      --target=aarch64-linux-android29 \\\n" +
                "      -o app/src/main/jniLibs/arm64-v8a/libshizuposed.so \\\n" +
                "      native/libshizuposed.c -llog -ldl\n" +
                "Or skip this check with -PskipNativeCheck=true.")
        }
        def len = so.length()
        if (len < 1024) {
            throw new GradleException(
                "libshizuposed.so at ${so.absolutePath} is only ${len} bytes — " +
                "probably a failed or empty build. Rebuild it.")
        }
        println "checkNativeShim: OK — ${len} bytes at ${so.absolutePath}"
    }
}

