            return
        }
        def len = so.length()
        if (len < 1024) {
            logger.warn("libsysku.so is only ${len} bytes.")
            return
        }
        def xstealth = new File(jniLibsDir, 'libxstealth.so')
        if (!xstealth.exists()) {
            logger.warn(
                "libsysku.so is present but libxstealth.so is not. " +
                "libsysku will load but stay inert.")
        }
        println "checkSysku: OK — ${len} bytes"
    }
}

