plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def stealthSeed = project.findProperty('stealthSeed')
    ?: (System.getProperty('user.name', 'user')
        + '@' + System.getProperty('user.home', 'home')
        + '/' + project.rootDir.absolutePath)

def stealthDigest = java.security.MessageDigest.getInstance('SHA-256')
stealthDigest.update(stealthSeed.getBytes('UTF-8'))
def stealthHash = stealthDigest.digest()

def alpha = 'abcdefghijklmnopqrstuvwxyz'

// Extract enough bytes from the digest for 1 + 5 + 9 = 15
// letters. Each byte picks one letter, modulo 26.
def sb = new StringBuilder()
for (int i = 0; i < 15; i++) {
    int idx = (stealthHash[i] & 0xFF) % 26
    sb.append(alpha.charAt(idx))
}
def allLetters = sb.toString()

def seg1 = allLetters.substring(0, 1)
def seg2 = allLetters.substring(1, 6)
def seg3 = allLetters.substring(6, 15)

ext.stealthApplicationId   = "${seg1}.${seg2}.${seg3}"
ext.stealthStatusAuthority = "${seg1}.${seg2}.${seg3}.status"
ext.stealthAppLabel        = 'Sync Service'

android {
    namespace 'com.shizuposed.manager'

    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 29
        targetSdk 37
        versionCode 5470
        versionName "1.2.7"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // ═════════════════════════════════════════════════════════════
    // FLAVORS
    //
    // standard: the normal build, applicationId
    //           com.shizuposed.manager, authority
    //           com.shizuposed.manager.status.
    //
    // stealth:  a separate APK with a randomly-generated
    //           applicationId of the form com.<x>.<y> and a
    //           matching status authority. Same signature, same
    //           code, different package name. Cannot update the
    //           standard build; must be installed separately.
    // ═════════════════════════════════════════════════════════════

    flavorDimensions "variant"

    productFlavors {
        standard {
            dimension "variant"
            applicationId "com.shizuposed.manager"
            manifestPlaceholders = [
                statusAuthority:      "com.shizuposed.manager.status",
                shizukuAuthority:     "com.shizuposed.manager.shizuku",
                watcherAuthority:     "com.shizuposed.manager.shizuku-watcher",
                fileProviderAuthority: "com.shizuposed.manager.fileprovider",
            ]
        }

        stealth {
            dimension "variant"
            applicationId project.ext.stealthApplicationId
            manifestPlaceholders = [
                statusAuthority:      project.ext.stealthStatusAuthority,
                shizukuAuthority:     project.ext.stealthApplicationId + ".shizuku",
                watcherAuthority:     project.ext.stealthApplicationId + ".shizuku-watcher",
                fileProviderAuthority: project.ext.stealthApplicationId + ".fileprovider",
            ]
            resValue "string", "app_name", project.ext.stealthAppLabel
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties missing — release APK will be unsigned")
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
        resValues true
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                '**/libshizuposed.so',
                '**/libamiru.so',
                '**/libcallsite.so',
                '**/libxstealth.so',
                '**/libxstealth_next.so',
                '**/libxstealth_bridge.so',
                '**/libsysku.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += layout.buildDirectory.dir('outputs/dex')
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')
    implementation files('libs/pine-0.3.0.jar')

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'

    implementation 'androidx.activity:activity:1.9.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
