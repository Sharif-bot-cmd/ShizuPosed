tasks.register('checkNativeShim') {
    description = 'Verify libshizuposed.so is present for arm64-v8a (required)'
    group = 'verification'
    def so = new File(jniLibsDir, 'libshizuposed.so')
    doLast {
        if (skipNativeCheck) { println "checkNativeShim: skipped"; return }
        if (!so.exists()) {
            throw new GradleException("libshizuposed.so not found at ${so.absolutePath}")
        }
        def len = so.length()
        if (len < 1024) {
            throw new GradleException("libshizuposed.so is only ${len} bytes")
        }
        println "checkNativeShim: OK — ${len} bytes"
    }
}

