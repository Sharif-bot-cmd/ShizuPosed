plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// ── Stealth package name (dynamic, per-build) ──────────────────
def stealthSeed = project.findProperty('stealthSeed')
    ?: (System.getProperty('user.name', 'user')
        + '@' + System.getProperty('user.home', 'home')
        + '/' + project.rootDir.absolutePath)

def stealthDigest = java.security.MessageDigest.getInstance('SHA-256')
stealthDigest.update(stealthSeed.getBytes('UTF-8'))
def stealthHash = stealthDigest.digest()

def alpha = 'abcdefghijklmnopqrstuvwxyz'
def sb = new StringBuilder()
for (int i = 0; i < 15; i++) {
    sb.append(alpha.charAt((stealthHash[i] & 0xFF) % 26))
}
def allLetters = sb.toString()
def seg1 = allLetters.substring(0, 1)
def seg2 = allLetters.substring(1, 6)
def seg3 = allLetters.substring(6, 15)

def stealthApplicationId   = "${seg1}.${seg2}.${seg3}"
def stealthStatusAuthority = "${stealthApplicationId}.status"
def stealthShizukuAuthority = "${stealthApplicationId}.shizuku"
def stealthWatcherAuthority = "${stealthApplicationId}.shizuku-watcher"
def stealthFileProviderAuthority = "${stealthApplicationId}.fileprovider"
def stealthAppLabel        = 'Calculator'

def bundleSiblings = (project.findProperty('bundleSiblings') ?: 'true') == 'true'

android {
    namespace 'com.shizuposed.manager'

    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 28
        targetSdk 37
        versionCode 5740
        versionName "1.4.5"

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField "String", "ORIGINAL_PACKAGE_NAME",
            "\"${applicationId}\""
        buildConfigField "String", "STEALTH_PACKAGE_NAME",
            "\"${stealthApplicationId}\""
    }

    flavorDimensions "variant"

    productFlavors {
        standard {
            dimension "variant"
            applicationId "com.shizuposed.manager"
            manifestPlaceholders = [
                statusAuthority:       "com.shizuposed.manager.status",
                shizukuAuthority:      "com.shizuposed.manager.shizuku",
                watcherAuthority:      "com.shizuposed.manager.shizuku-watcher",
                fileProviderAuthority: "com.shizuposed.manager.fileprovider",
            ]
            buildConfigField "String", "STEALTH_APK_ASSET",
                "\"stealth-manager.apk\""
            buildConfigField "String", "STANDARD_APK_ASSET",
                "\"\""
        }

        stealth {
            dimension "variant"
            applicationId stealthApplicationId
            manifestPlaceholders = [
                statusAuthority:       stealthStatusAuthority,
                shizukuAuthority:      stealthShizukuAuthority,
                watcherAuthority:      stealthWatcherAuthority,
                fileProviderAuthority: stealthFileProviderAuthority,
            ]
            resValue "string", "app_name", stealthAppLabel
            buildConfigField "String", "STEALTH_APK_ASSET",
                "\"\""
            buildConfigField "String", "STANDARD_APK_ASSET",
                "\"standard-manager.apk\""
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties missing — release APK will be unsigned")
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
        resValues true
    }

    androidResources {
        noCompress += [".so"]
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                '**/libshizuposed.so',
                '**/libamiru.so',
                '**/libcallsite.so',
                '**/libxstealth.so',
                '**/libxstealth_next.so',
                '**/libxstealth_bridge.so',
                '**/libsysku.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += layout.buildDirectory.dir('outputs/dex')
        }
        standard {
            if (bundleSiblings) {
                assets.srcDirs += layout.buildDirectory.dir('bundled-apks/standard')
            }
        }
        stealth {
            if (bundleSiblings) {
                assets.srcDirs += layout.buildDirectory.dir('bundled-apks/stealth')
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')
    implementation files('libs/pine-0.3.0.jar')

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
