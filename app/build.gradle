    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}

// ═══════════════════════════════════════════════════════════════════════════
// SIBLING APK BUNDLING — configuration-cache compatible
//
// Everything the task needs is captured at configuration time.
// The doLast closure uses only plain Java I/O (ProcessBuilder,
// java.nio.file.Files) — no `project`, no `exec { }`, no
// `copy { }`. This is required by Gradle 9.8's configuration
// cache, which forbids touching `project` at execution time.
// ═══════════════════════════════════════════════════════════════════════════

def rootDirPath = project.rootDir.absolutePath
def gradlewFile = new File(project.rootDir, 'gradlew')
def gradlewPath = gradlewFile.exists() ? gradlewFile.absolutePath : null
def bundledApksStdDir = layout.buildDirectory.dir('bundled-apks/standard').get().asFile
def bundledApksStlDir = layout.buildDirectory.dir('bundled-apks/stealth').get().asFile
def rawStandardApkFile = layout.buildDirectory.file(
    'outputs/apk/standard/release/app-standard-release.apk').get().asFile
def rawStealthApkFile = layout.buildDirectory.file(
    'outputs/apk/stealth/release/app-stealth-release.apk').get().asFile

tasks.register('assembleBothReleases') {
    group = 'build'
    description = 'Build both flavors with each other bundled as assets'

    def capturedRootDir = rootDirPath
    def capturedGradlewPath = gradlewPath
    def capturedStdDest = bundledApksStdDir
    def capturedStlDest = bundledApksStlDir
    def capturedRawStd = rawStandardApkFile
    def capturedRawStl = rawStealthApkFile

    doLast {
        def runGradle = { List<String> args ->
            def exe = capturedGradlewPath != null
                ? capturedGradlewPath
                : 'gradle'
            def cmd = [exe] + args
            def pb = new ProcessBuilder(cmd)
            pb.directory(new File(capturedRootDir))
            pb.redirectErrorStream(true)
            def proc = pb.start()
            proc.inputStream.eachLine { line -> println line }
            def rc = proc.waitFor()
            if (rc != 0) {
                throw new GradleException(
                    "Gradle subprocess failed with exit code ${rc}: ${cmd}")
            }
        }

        println "=== Phase 1: building raw APKs (no siblings) ==="
        runGradle(['clean', 'assembleStandardRelease',
                   'assembleStealthRelease',
                   '-PbundleSiblings=false',
                   '-PskipNativeCheck=true'])

        println "=== Staging sibling APKs ==="
        capturedStdDest.mkdirs()
        capturedStlDest.mkdirs()

        def copyFile = { File from, File to ->
            if (!from.exists()) {
                throw new GradleException(
                    "Expected APK not found: ${from.absolutePath}")
            }
            java.nio.file.Files.copy(
                from.toPath(),
                to.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "  ${from.name} -> ${to.absolutePath}"
        }

        copyFile(capturedRawStd,
                 new File(capturedStdDest, 'standard-manager.apk'))
        copyFile(capturedRawStl,
                 new File(capturedStlDest, 'stealth-manager.apk'))

        println "=== Phase 2: building final APKs (with siblings) ==="
        runGradle(['assembleStandardRelease',
                   'assembleStealthRelease',
                   '-PbundleSiblings=true'])

        println "=== Done ==="
        println "Standard: ${capturedRawStd.absolutePath}"
        println "Stealth:  ${capturedRawStl.absolutePath}"
    }
}

