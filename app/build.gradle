// Capture the ext values as locals at configuration time. The
// doLast closure must not touch `project` — the configuration
// cache forbids it, and Gradle 9 enforces that as an error.
def printStealthIdValue     = ext.stealthApplicationId
def printStealthAuthority   = ext.stealthStatusAuthority
def printStealthLabel       = ext.stealthAppLabel

tasks.register('printStealthId') {
    group = 'help'
    description = 'Print the stealth package name that this build will use'

    // Declare them as inputs so the task knows when to re-run,
    // and so the configuration cache treats them as values, not
    // references to live project state.
    inputs.property('stealthId', printStealthIdValue)
    inputs.property('stealthAuthority', printStealthAuthority)
    inputs.property('stealthLabel', printStealthLabel)

    doLast {
        println "stealth applicationId:    ${printStealthIdValue}"
        println "stealth status authority: ${printStealthAuthority}"
        println "stealth app label:        ${printStealthLabel}"
        println ""
        println "Override with -PstealthSeed=<anything> for a different ID."
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// HELPER FUNCTIONS
//
// These are top-level script methods, not closures. They don't touch
// Gradle script objects, so they can be called from doLast blocks
// without breaking the configuration cache.
// ═══════════════════════════════════════════════════════════════════════════

def extractZipEntries = { File archive, File destDir, Closure<Boolean> selector ->
    if (!archive.exists()) return
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def entries = zip.entries()
        def destCanonical = destDir.canonicalPath
        while (entries.hasMoreElements()) {
            def entry = entries.nextElement()
            if (entry.isDirectory()) continue
            if (selector != null && !selector.call(entry.name)) continue

            def target = new File(destDir, entry.name)
            if (!target.canonicalPath.startsWith(destCanonical)) continue
            target.parentFile?.mkdirs()

            zip.getInputStream(entry).withCloseable { input ->
                target.withOutputStream { output ->
                    input.transferTo(output)
                }
            }
        }
    } finally {
        zip.close()
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// NATIVE LIBRARY PRESENCE CHECKS
//
// Under Gradle 9.x's configuration cache, tasks must not call
// `project.hasProperty(...)` or `project.file(...)` at execution
// time. Everything they need is captured into local variables during
// configuration and referenced from the doLast closures.
//
// libshizuposed.so        required — NativeBackend depends on it.
// libamiru.so             optional — AmiruBackend reports unavailable.
// libcallsite.so          optional — CallSiteBackend reports unavailable.
// libxstealth.so          optional — XStealthNative reports unavailable.
// libxstealth_next.so     optional — XStealthNativeNext reports unavailable.
// libxstealth_bridge.so   optional — XStealthBridge reports unavailable.
// libsysku.so             optional — SyskuNative reports unavailable.
//
// Skip all seven with: -PskipNativeCheck=true
// ═══════════════════════════════════════════════════════════════════════════

def skipNativeCheck = project.hasProperty('skipNativeCheck')
        && project.property('skipNativeCheck') == 'true'

def jniLibsDir = file('src/main/jniLibs/arm64-v8a')

tasks.register('checkNativeShim') {
    description = 'Verify libshizuposed.so is present for arm64-v8a (required)'
    group = 'verification'

    def so = new File(jniLibsDir, 'libshizuposed.so')

    doLast {
        if (skipNativeCheck) {
            println "checkNativeShim: skipped via -PskipNativeCheck=true"
            return
        }
        if (!so.exists()) {
            throw new GradleException(
                "libshizuposed.so not found at ${so.absolutePath}\n" +
                "Build it with:\n" +
                "  clang -shared -fPIC -O2 -Wall -Wextra \\\n" +
                "      --target=aarch64-linux-android29 \\\n" +
                "      -o app/src/main/jniLibs/arm64-v8a/libshizuposed.so \\\n" +
                "      native/libshizuposed.c -llog -ldl\n" +
                "Or skip this check with -PskipNativeCheck=true " +
                "(NativeBackend will degrade to Pine-only).")
        }
        def len = so.length()
        if (len < 1024) {
            throw new GradleException(
                "libshizuposed.so at ${so.absolutePath} is only ${len} bytes — " +
                "probably a failed or empty build. Rebuild it.")
        }
        println "checkNativeShim: OK — ${len} bytes at ${so.absolutePath}"
    }
}

