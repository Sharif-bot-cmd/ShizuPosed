plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.shizuposed.manager'

    // API 37 uses minor-versioned platforms (android-37.0, 37.1, 37.2).
    // AGP 8.10+ exposes compileSdkMinor. If your AGP is older and rejects
    // it, comment the line out — AGP will fall back to "android-37".
    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 29
        targetSdk 37
        versionCode 17
        versionName "2.9"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties missing — release APK will be unsigned")
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('outputs/dex')
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')
    implementation files('libs/pine-0.3.0.jar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}

// ─────────────────────────────────────────────────────────────────────────
// XposedHook.dex pipeline
//
// Notes:
//  • Uses AGP's android.jar from the resolved compileSdk platform, not
//    android.bootClasspath (removed in newer AGP).
//  • Uses android.defaultConfig.minSdk for --min-api.
//  • Output-only inputs (see below) — no `inputs.dir` on the classes dir.
//  • Writes only into build/, never into src/.
// ─────────────────────────────────────────────────────────────────────────

tasks.register('makeDex') {
    description = 'Build XposedHook.dex from compiled classes + Pine'
    group = 'build'

    dependsOn 'compileDebugJavaWithJavac'

    def classesDirProvider = layout.buildDirectory.dir('intermediates/javac/debug/classes')
    def outDirProvider     = layout.buildDirectory.dir('outputs/dex')
    def outDexProvider     = outDirProvider.map { dir -> new File(dir.asFile, 'XposedHook.dex') }

    // Output-only. Gradle tracks these for up-to-date checks without
    // needing the input directory to exist at configuration time.
    outputs.dir(outDirProvider)
    outputs.file(outDexProvider)

    def sdkDir = System.getenv('ANDROID_HOME')
        ?: System.getenv('ANDROID_SDK_ROOT')
        ?: project.findProperty('android.sdk.dir')

    if (sdkDir == null) {
        throw new GradleException(
            "ANDROID_HOME / ANDROID_SDK_ROOT / android.sdk.dir not set — cannot locate d8.")
    }

    def buildToolsRoot = new File(sdkDir, 'build-tools')
    if (!buildToolsRoot.exists()) {
        throw new GradleException("No build-tools under $buildToolsRoot")
    }

    def d8 = buildToolsRoot.listFiles()
        .findAll { it.isDirectory() }
        .sort { a, b -> b.name <=> a.name }
        .collect { new File(it, 'd8') }
        .find { it.exists() }

    if (d8 == null) {
        throw new GradleException(
            "d8 not found under $buildToolsRoot. Install build-tools via sdkmanager.")
    }

    // Resolve android.jar once at configuration time. We know the
    // compileSdk and the minor version from the android { } block above.
    // API 37 uses a versioned platform dir (android-37.0) on newer AGP;
    // fall back to android-37 for older AGP, then to android-36 as a
    // last resort so the build still works on the API 36 preview SDK.
    def compileSdkVersion = android.compileSdk
    def compileSdkMinor   = 0
    try {
        compileSdkMinor = android.compileSdkMinor
    } catch (Throwable ignored) {}

    def platformsRoot = new File(sdkDir, 'platforms')
    def candidatePlatformDirs = [
        compileSdkMinor > 0 ? "android-${compileSdkVersion}.${compileSdkMinor}" : null,
        "android-${compileSdkVersion}",
        "android-36",
        "android-35",
    ].findAll { it != null }

    File platformJar = null
    File platformDirUsed = null
    for (String name : candidatePlatformDirs) {
        File candidate = new File(platformsRoot, "${name}/android.jar")
        if (candidate.exists()) {
            platformJar = candidate
            platformDirUsed = new File(platformsRoot, name)
            break
        }
    }

    if (platformJar == null) {
        throw new GradleException(
            "Could not locate android.jar under ${platformsRoot.absolutePath}. " +
            "Tried: ${candidatePlatformDirs.join(', ')}. " +
            "Install the platform with sdkmanager, e.g. " +
            "`sdkmanager \"platforms;android-${compileSdkVersion}\"`.")
    }

    doLast {
        def classesDir = classesDirProvider.get().asFile
        def outDir     = outDirProvider.get().asFile
        def outDex     = new File(outDir, 'XposedHook.dex')

        if (!classesDir.exists()) {
            println "makeDex: classes dir missing (${classesDir.absolutePath}) — creating empty"
            classesDir.mkdirs()
        }
        outDir.mkdirs()

        def wanted = []
        classesDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def p = f.absolutePath
            if (p.contains('/core/') || p.contains('/de/robv/android/xposed/')) {
                wanted << p
            }
        }

        def pineJar = file("${projectDir}/libs/pine-0.3.0.jar")
        if (pineJar.exists()) {
            def pineExtract = new File(outDir, 'pine-classes')
            pineExtract.mkdirs()
            copy {
                from zipTree(pineJar)
                into pineExtract
                include '**/*.class'
            }
            pineExtract.eachFileRecurse { f ->
                if (f.name.endsWith('.class')) wanted << f.absolutePath
            }
            println "makeDex: Pine classes extracted from ${pineJar.name}"
        } else {
            println "makeDex: WARNING — Pine jar not found at ${pineJar.absolutePath}"
        }

        if (wanted.isEmpty()) {
            throw new GradleException(
                "No .class files matched. Check that the app compiles and " +
                "that libs/pine-0.3.0.jar exists.")
        }
        println "makeDex: ${wanted.size()} .class files matched"

        def libJars = []
        try {
            configurations.debugCompileClasspath.resolve().each { f ->
                if (f.name.endsWith('.jar')) {
                    libJars << f.absolutePath
                } else if (f.name.endsWith('.aar')) {
                    def cacheDir = new File(outDir, "aar-libs/${f.name}")
                    cacheDir.mkdirs()
                    def classesJar = new File(cacheDir, 'classes.jar')
                    if (!classesJar.exists()) {
                        copy {
                            from zipTree(f).matching { include 'classes.jar' }
                            into cacheDir
                        }
                    }
                    if (classesJar.exists()) libJars << classesJar.absolutePath
                }
            }
        } catch (Throwable t) {
            println "makeDex: warning — could not resolve debugCompileClasspath: ${t.message}"
        }

        // Add the resolved android.jar as a --lib entry.
        libJars << platformJar.absolutePath
        println "makeDex: using platform jar ${platformJar.absolutePath}"
        println "makeDex: platform dir ${platformDirUsed.absolutePath}"

        def minSdk = android.defaultConfig.minSdk

        def cmd = [d8.absolutePath, '--release', '--min-api', "$minSdk",
                   '--output', outDir.absolutePath]
        cmd.addAll(wanted)
        libJars.each { j -> cmd.addAll(['--lib', j]) }

        println "makeDex: running d8 -> $outDex"
        def proc = cmd.execute()
        def stdout = new StringBuilder()
        def stderr = new StringBuilder()
        proc.waitForProcessOutput(stdout, stderr)
        if (stdout.length() > 0) print stdout.toString()
        if (stderr.length() > 0) System.err.print(stderr.toString())

        if (proc.exitValue() != 0) {
            throw new GradleException("d8 failed with exit code ${proc.exitValue()}")
        }

        def produced = new File(outDir, 'classes.dex')
        if (produced.exists()) {
            if (outDex.exists()) outDex.delete()
            if (!produced.renameTo(outDex)) {
                outDex.bytes = produced.bytes
                produced.delete()
            }
        }

        if (!outDex.exists() || outDex.length() == 0) {
            throw new GradleException("d8 produced no usable dex at $outDex")
        }
        println "makeDex: done — ${outDex.length()} bytes at $outDex"
    }
}

// ─────────────────────────────────────────────────────────────────────────
// Task wiring
// ─────────────────────────────────────────────────────────────────────────

tasks.matching { it.name == 'mergeDebugAssets' ||
                 it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name == 'assembleDebug' ||
                 it.name == 'assembleRelease' }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('generate') &&
                 it.name.contains('LintVital') &&
                 it.name.endsWith('ReportModel') }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('generate') &&
                 it.name.endsWith('LintReportModel') }.configureEach {
    dependsOn 'makeDex'
}

tasks.matching { it.name.startsWith('lint') }.configureEach {
    mustRunAfter 'makeDex'
}

clean.doLast {
    // The dex lives under build/outputs/dex and is wiped by `clean` already.
}