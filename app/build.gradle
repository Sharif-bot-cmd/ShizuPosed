plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.shizuposed.manager'

    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.shizuposed.manager"
        minSdk 29
        targetSdk 37
        versionCode 3920
        versionName "1.0.6"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties missing — release APK will be unsigned")
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                '**/libshizuposed.so',
                '**/libamiru.so',
                '**/libcallsite.so',
                '**/libxstealth.so',
                '**/libxstealth_next.so',
                '**/libxstealth_bridge.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += layout.buildDirectory.dir('outputs/dex')
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('libs/shizuku-api.jar')
    implementation files('libs/shizuku-provider.jar')
    implementation files('libs/shizuku-aidl.jar')
    implementation files('libs/shizuku-shared.jar')
    implementation files('libs/pine-0.3.0.jar')

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'

    implementation 'androidx.activity:activity:1.9.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}

// ═══════════════════════════════════════════════════════════════════════════
// HELPER FUNCTIONS
//
// These are top-level script methods, not closures. They don't touch
// Gradle script objects, so they can be called from doLast blocks
// without breaking the configuration cache.
// ═══════════════════════════════════════════════════════════════════════════

/**
 * Extract the entries of a zip archive that match a selector into
 * a destination directory. Replaces the `copy { from zipTree(...) }`
 * DSL, which is not allowed inside a doLast block under the
 * configuration cache.
 *
 * @param archive  the zip/jar/aar to read
 * @param destDir  where to write the extracted entries
 * @param selector closure that returns true for entries to extract
 */

def extractZipEntries = { File archive, File destDir, Closure<Boolean> selector ->
    if (!archive.exists()) return
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def entries = zip.entries()
        def destCanonical = destDir.canonicalPath
        while (entries.hasMoreElements()) {
            def entry = entries.nextElement()
            if (entry.isDirectory()) continue
            if (selector != null && !selector.call(entry.name)) continue

            def target = new File(destDir, entry.name)
            if (!target.canonicalPath.startsWith(destCanonical)) continue
            target.parentFile?.mkdirs()

            zip.getInputStream(entry).withCloseable { input ->
                target.withOutputStream { output ->
                    input.transferTo(output)
                }
            }
        }
    } finally {
        zip.close()
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// NATIVE LIBRARY PRESENCE CHECKS
//
// Under Gradle 9.x's configuration cache, tasks must not call
// `project.hasProperty(...)` or `project.file(...)` at execution
// time. Everything they need is captured into local variables during
// configuration and referenced from the doLast closures.
//
// libshizuposed.so        required — NativeBackend depends on it.
// libamiru.so             optional — AmiruBackend reports unavailable.
// libcallsite.so          optional — CallSiteBackend reports unavailable.
// libxstealth.so          optional — XStealthNative reports unavailable.
// libxstealth_next.so     optional — XStealthNativeNext reports unavailable.
// libxstealth_bridge.so   optional — XStealthBridge reports unavailable.
//
// Skip all six with: -PskipNativeCheck=true
// ═══════════════════════════════════════════════════════════════════════════

def skipNativeCheck = project.hasProperty('skipNativeCheck')
        && project.property('skipNativeCheck') == 'true'

def jniLibsDir = file('src/main/jniLibs/arm64-v8a')

tasks.register('checkNativeShim') {
    description = 'Verify libshizuposed.so is present for arm64-v8a (required)'
    group = 'verification'

    def so = new File(jniLibsDir, 'libshizuposed.so')

    doLast {
        if (skipNativeCheck) {
            println "checkNativeShim: skipped via -PskipNativeCheck=true"
            return
        }
        if (!so.exists()) {
            throw new GradleException(
                "libshizuposed.so not found at ${so.absolutePath}\n" +
                "Build it with:\n" +
                "  clang -shared -fPIC -O2 -Wall -Wextra \\\n" +
                "      --target=aarch64-linux-android29 \\\n" +
                "      -o app/src/main/jniLibs/arm64-v8a/libshizuposed.so \\\n" +
                "      native/libshizuposed.c -llog -ldl\n" +
                "Or skip this check with -PskipNativeCheck=true " +
                "(NativeBackend will degrade to Pine-only).")
        }
        def len = so.length()
        if (len < 1024) {
            throw new GradleException(
                "libshizuposed.so at ${so.absolutePath} is only ${len} bytes — " +
                "probably a failed or empty build. Rebuild it.")
        }
        println "checkNativeShim: OK — ${len} bytes at ${so.absolutePath}"
    }
}

