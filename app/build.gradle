// ═══════════════════════════════════════════════════════════════════════════
// CLOAK LEAK CHECK
//
// Fails the build if the literal string "com.shizuposed.manager" appears
// in classes.dex or resources.arsc. Under the same-length cloak model,
// the package name is patched in AndroidManifest.xml only; any other
// occurrence (BuildConfig field, resValue, hardcoded constant) survives
// the patch and makes the cloaked APK detectable.
//
// This is the CI gate for Phase 0.2 of the cloak migration.
// ═══════════════════════════════════════════════════════════════════════════

def androidHome = System.getenv('ANDROID_HOME')
    ?: System.getenv('ANDROID_SDK_ROOT')
    ?: project.findProperty('android.sdk.dir')

if (androidHome == null) {
    throw new GradleException("ANDROID_HOME not set — cannot locate build-tools.")
}

def buildToolsRoot = new File(androidHome.toString(), 'build-tools')
if (!buildToolsRoot.exists()) {
    throw new GradleException("No build-tools under $buildToolsRoot")
}

def latestBuildTools = buildToolsRoot.listFiles()
    .findAll { it.isDirectory() }
    .sort { a, b -> b.name <=> a.name }
    .find()

def dexdumpTool = latestBuildTools != null
    ? new File(latestBuildTools, 'dexdump') : null
def aapt2Tool = latestBuildTools != null
    ? new File(latestBuildTools, 'aapt2') : null

tasks.register('checkNoOldPackageLeak') {
    group = 'verification'
    description = 'Fail if com.shizuposed.manager leaks into classes.dex or resources.arsc'

    def apk = layout.buildDirectory.file(
        'outputs/apk/release/app-release.apk').get().asFile
    def capturedDexdump = dexdumpTool != null ? dexdumpTool.absolutePath : null
    def capturedAapt2 = aapt2Tool != null ? aapt2Tool.absolutePath : null

    doLast {
        if (!apk.exists()) {
            throw new GradleException("APK not found: ${apk}")
        }
        if (capturedDexdump == null || capturedAapt2 == null) {
            logger.warn("checkNoOldPackageLeak: build-tools missing, skipping")
            return
        }

        def tmp = File.createTempFile('dexcheck', '.dex')
        try {
            def zf = new java.util.zip.ZipFile(apk)
            try {
                def e = zf.getEntry('classes.dex')
                if (e != null) {
                    tmp.withOutputStream { out ->
                        zf.getInputStream(e).withCloseable { it.transferTo(out) }
                    }
                    def pb = new ProcessBuilder(capturedDexdump, '-d', tmp.absolutePath)
                    pb.redirectErrorStream(true)
                    def proc = pb.start()
                    def text = proc.inputStream.text
                    proc.waitFor()
                    if (text.contains('com.shizuposed.manager')) {
                        throw new GradleException(
                            "classes.dex contains the literal 'com.shizuposed.manager'. "
                            + "Remove the BuildConfig field that sources it.")
                    }
                }
            } finally { zf.close() }
        } finally { tmp.delete() }

        def pb2 = new ProcessBuilder(capturedAapt2, 'dump', 'resources', apk.absolutePath)
        pb2.redirectErrorStream(true)
        def proc2 = pb2.start()
        def arsc = proc2.inputStream.text
        proc2.waitFor()
        if (arsc.contains('com.shizuposed.manager')) {
            throw new GradleException(
                "resources.arsc contains 'com.shizuposed.manager'. "
                + "Remove the resValue string that sources it.")
        }
        println "checkNoOldPackageLeak: OK"
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'checkNoOldPackageLeak'
}

// ═══════════════════════════════════════════════════════════════════════════
// XPOSEDHOOK.DEX PIPELINE
//
// Compiles the release Java classes, runs d8 on the subset the hook
// needs (core + xposed shim + libxposed vendor + stealth), and
// writes build/outputs/dex/XposedHook.dex. That directory is added
// to sourceSets.main's assets, so the merge*Assets tasks pick it up.
// ═══════════════════════════════════════════════════════════════════════════

def makeDexBuildToolsRoot = new File(androidHome.toString(), 'build-tools')

def makeDexD8 = makeDexBuildToolsRoot.listFiles()
    .findAll { it.isDirectory() }
    .sort { a, b -> b.name <=> a.name }
    .collect { new File(it, 'd8') }
    .find { it.exists() }

if (makeDexD8 == null) {
    throw new GradleException("d8 not found under $makeDexBuildToolsRoot")
}

def makeDexCompileSdkVersion = android.compileSdk
def makeDexCompileSdkMinor = 0
try { makeDexCompileSdkMinor = android.compileSdkMinor } catch (Throwable ignored) {}

def makeDexPlatformsRoot = new File(androidHome.toString(), 'platforms')
def makeDexCandidatePlatformDirs = [
    makeDexCompileSdkMinor > 0
        ? "android-${makeDexCompileSdkVersion}.${makeDexCompileSdkMinor}" : null,
    "android-${makeDexCompileSdkVersion}",
    "android-37.0", "android-36", "android-35",
].findAll { it != null }

def makeDexPlatformJar = null
for (String name : makeDexCandidatePlatformDirs) {
    File candidate = new File(makeDexPlatformsRoot, "${name}/android.jar")
    if (candidate.exists()) { makeDexPlatformJar = candidate; break }
}

if (makeDexPlatformJar == null) {
    throw new GradleException("Could not locate android.jar")
}

def makeDexCompileClasspathFiles = provider {
    def cp = configurations.findByName('releaseCompileClasspath')
    if (cp == null) cp = configurations.findByName('debugCompileClasspath')
    if (cp == null) {
        cp = configurations.find { c -> c.name.endsWith('CompileClasspath') }
    }
    if (cp == null) return [] as Set<File>
    try {
        return cp.resolve()
    } catch (Throwable t) {
        println "makeDex: warning — could not resolve ${cp.name}: ${t.message}"
        return [] as Set<File>
    }
}

def makeDexMinSdk = android.defaultConfig.minSdk
def capturedPineJarPath = new File(projectDir, 'libs/pine-0.3.0.jar').absolutePath
def capturedD8Path = makeDexD8.absolutePath
def capturedPlatformJarPath = makeDexPlatformJar.absolutePath
def capturedMinSdk = makeDexMinSdk

tasks.register('makeDex') {
    group = 'build'
    dependsOn 'compileReleaseJavaWithJavac'

    def classesDirProvider = layout.buildDirectory.dir(
        'intermediates/javac/release/classes')
    def alternateClassesDirProvider = layout.buildDirectory.dir(
        'intermediates/javac/release/compileReleaseJavaWithJavac/classes')
    def fallbackClassesDirProvider = layout.buildDirectory.dir(
        'intermediates/javac/debug/classes')
    def outDirProvider = layout.buildDirectory.dir('outputs/dex')
    def outDexProvider = outDirProvider.map { dir -> new File(dir.asFile, 'XposedHook.dex') }
    def pineJarFile = new File(capturedPineJarPath)

    def compileClasspathProvider = makeDexCompileClasspathFiles
    def d8Path = capturedD8Path
    def platformJarPath = capturedPlatformJarPath
    def minSdkStr = capturedMinSdk.toString()

    outputs.dir(outDirProvider)
    outputs.file(outDexProvider)

    doLast {
        def outDir = outDirProvider.get().asFile
        def outDex = new File(outDir, 'XposedHook.dex')

        def candidates = [
            classesDirProvider.get().asFile,
            alternateClassesDirProvider.get().asFile,
            fallbackClassesDirProvider.get().asFile,
        ]
        def classesDir = candidates.find { it.exists() }
        if (classesDir == null) classesDir = candidates[0]
        outDir.mkdirs()

        def wanted = []
        classesDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def p = f.absolutePath
            if (p.contains('/core/')
                    || p.contains('/de/robv/android/xposed/')
                    || p.contains('/io/github/libxposed/')
                    || p.contains('/stealth/')) {
                wanted << p
            }
        }

        if (pineJarFile.exists()) {
            def pineExtract = new File(outDir, 'pine-classes')
            pineExtract.mkdirs()
            def pineZip = new java.util.zip.ZipFile(pineJarFile)
            try {
                def pineEntries = pineZip.entries()
                def pineCanonical = pineExtract.canonicalPath
                while (pineEntries.hasMoreElements()) {
                    def entry = pineEntries.nextElement()
                    if (entry.isDirectory()) continue
                    if (!entry.name.endsWith('.class')) continue
                    def target = new File(pineExtract, entry.name)
                    if (!target.canonicalPath.startsWith(pineCanonical)) continue
                    target.parentFile?.mkdirs()
                    pineZip.getInputStream(entry).withCloseable { input ->
                        target.withOutputStream { output ->
                            input.transferTo(output)
                        }
                    }
                }
            } finally { pineZip.close() }
            pineExtract.eachFileRecurse { f ->
                if (f.name.endsWith('.class')) wanted << f.absolutePath
            }
        }

        if (wanted.isEmpty()) {
            throw new GradleException("No .class files matched.")
        }

        def libJars = new ArrayList<String>()
        def aarFiles = []
        try {
            compileClasspathProvider.get().each { f ->
                if (f.name.endsWith('.jar')) {
                    libJars << f.absolutePath
                } else if (f.name.endsWith('.aar')) {
                    aarFiles << f
                }
            }
        } catch (Throwable t) {
            println "makeDex: warning — could not enumerate compile classpath: ${t.message}"
        }

        for (File aar : aarFiles) {
            def cacheDir = new File(outDir, "aar-libs/${aar.name}")
            cacheDir.mkdirs()
            def classesJar = new File(cacheDir, 'classes.jar')
            if (!classesJar.exists()) {
                def aarZip = new java.util.zip.ZipFile(aar)
                try {
                    def aarEntries = aarZip.entries()
                    def aarCanonical = cacheDir.canonicalPath
                    while (aarEntries.hasMoreElements()) {
                        def entry = aarEntries.nextElement()
                        if (entry.isDirectory()) continue
                        if (entry.name != 'classes.jar') continue
                        def target = new File(cacheDir, entry.name)
                        if (!target.canonicalPath.startsWith(aarCanonical)) continue
                        target.parentFile?.mkdirs()
                        aarZip.getInputStream(entry).withCloseable { input ->
                            target.withOutputStream { output ->
                                input.transferTo(output)
                            }
                        }
                    }
                } finally { aarZip.close() }
            }
            if (classesJar.exists()) libJars << classesJar.absolutePath
        }

        libJars << platformJarPath

        def cmd = [d8Path, '--release',
                   '--min-api', minSdkStr,
                   '--output', outDir.absolutePath]
        cmd.addAll(wanted)
        libJars.each { j -> cmd.addAll(['--lib', j]) }

        def pb = new ProcessBuilder(cmd)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        proc.inputStream.eachLine { line -> println line }
        def rc = proc.waitFor()

        if (rc != 0) {
            throw new GradleException("d8 failed with exit code ${rc}")
        }

        def produced = new File(outDir, 'classes.dex')
        if (produced.exists()) {
            if (outDex.exists()) outDex.delete()
            if (!produced.renameTo(outDex)) {
                outDex.bytes = produced.bytes
                produced.delete()
            }
        }

        if (!outDex.exists() || outDex.length() == 0) {
            throw new GradleException("d8 produced no usable dex at $outDex")
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// makeDex TASK WIRING
//
// sourceSets.main adds build/outputs/dex to the assets source dirs,
// so every task that reads assets depends on makeDex producing that
// directory. Declaring the dependency explicitly is required by
// Gradle 9.8 — it no longer infers it from the sourceSets entry.
//
// The consumers fall into four groups:
//   • Asset merge tasks (merge*Assets)
//   • Lint analysis (lintVitalAnalyze*, lintAnalyze*, lintVitalReport*)
//   • Lint model writers (generate*LintVitalReportModel)
//   • Assembly (assemble*)
//
// If you add a new variant or a new task that reads assets, add it
// to one of these matchers. Missing one produces the same
// "implicit dependency" error at build time.
// ═══════════════════════════════════════════════════════════════════════════

tasks.matching { t ->
    def n = t.name
    // Asset merges
    n == 'mergeReleaseAssets' ||
    n == 'mergeDebugAssets'   ||
    // Lint analysis
    n.startsWith('lintVitalAnalyze') ||
    n.startsWith('lintAnalyze')      ||
    n.startsWith('lintVitalReport')  ||
    // Lint model writers
    n.startsWith('generate') && n.endsWith('LintVitalReportModel') ||
    // Assemblies
    n == 'assembleRelease' ||
    n == 'assembleDebug'
}.configureEach {
    dependsOn 'makeDex'
}

// ═══════════════════════════════════════════════════════════════════════════
// VERIFICATION WIRING
//
// checkNativeShim remains required. The six optional checks stay
// warn-only. None of them changed under the cloak migration.
// ═══════════════════════════════════════════════════════════════════════════

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    dependsOn 'checkNativeShim'
    dependsOn 'checkCallSite'
    dependsOn 'checkAmiru'
    dependsOn 'checkXStealth'
    dependsOn 'checkXStealthNext'
    dependsOn 'checkXStealthBridge'
    dependsOn 'checkSysku'
}