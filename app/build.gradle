// ─── Sysku ────────────────────────────────────────────────────────────────
//
// libsysku.so is optional. It complements libxstealth.so by
// interposing syscall() and getdents64(), the two paths the named
// libc interposers can't reach. Without it, the framework still runs
// — SyskuController.getState() reports "Not installed" and the
// Settings tab's Sysku row is informational only.
//
// It requires libxstealth.so (v0.18.0+) at runtime because it reads
// the xstealth_path_is_blocked / xstealth_fd_resolves_to_hidden /
// xstealth_is_active exports. If libxstealth.so is missing, libsysku
// loads but stays inert, and nativeInit() returns 0 — fail-open.

tasks.register('checkSysku') {
    description = 'Verify libsysku.so is present for arm64-v8a (optional)'
    group = 'verification'

    def so = new File(jniLibsDir, 'libsysku.so')

    doLast {
        if (skipNativeCheck) {
            println "checkSysku: skipped via -PskipNativeCheck=true"
            return
        }
        if (!so.exists()) {
            logger.warn(
                "libsysku.so not found at ${so.absolutePath}\n" +
                "  Sysku will be unavailable. The Settings tab's Sysku row\n" +
                "  will report 'Not installed'. All other backends are\n" +
                "  unaffected. To build it:\n" +
                "    clang -shared -fPIC -O2 -Wall -Wextra \\\n" +
                "        --target=aarch64-linux-android29 \\\n" +
                "        -o app/src/main/jniLibs/arm64-v8a/libsysku.so \\\n" +
                "        native/libsysku.c -llog -ldl\n" +
                "  This is a warning, not an error — the build will proceed.")
            return
        }
        def len = so.length()
        if (len < 1024) {
            logger.warn(
                "libsysku.so at ${so.absolutePath} is only ${len} bytes — " +
                "probably a failed or empty build. Sysku will be unavailable.")
            return
        }
        // Sysku depends on libxstealth.so's exports. Warn if
        // libxstealth isn't present, because libsysku will load
        // but stay inert without it — a confusing state to debug.
        def xstealth = new File(jniLibsDir, 'libxstealth.so')
        if (!xstealth.exists()) {
            logger.warn(
                "libsysku.so is present but libxstealth.so is not. " +
                "libsysku will load but stay inert — it depends on " +
                "xstealth_path_is_blocked / xstealth_fd_resolves_to_hidden / " +
                "xstealth_is_active from libxstealth.so (v0.18.0+). " +
                "Build libxstealth.so or accept that Sysku's interposers " +
                "will pass everything through.")
        }
        println "checkSysku: OK — ${len} bytes at ${so.absolutePath}"
    }
}

